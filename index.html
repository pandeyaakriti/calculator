<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>math.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="scene">
    <main class="calculator" role="group" aria-label="Calculator">

      <header class="calculator__header">
        <p class="calculator__title">math.me</p>
        <button class="icon-btn" data-action="backspace" aria-label="Delete last character" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M8.5 5h11A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-11a1.5 1.5 0 0 1-1.18-.57L3 12l4.32-6.43A1.5 1.5 0 0 1 8.5 5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M11 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <section class="display" aria-live="polite" aria-atomic="true">
        <p class="display__expression" id="expression">&nbsp;</p>
        <p class="display__result" id="result">0</p>
      </section>

      <section class="keypad">
        <button class="key key--muted" data-action="clear" type="button">C</button>
        <button class="key key--muted" data-action="negate" type="button">±</button>
        <button class="key key--muted" data-action="percent" type="button">%</button>
        <button class="key key--operator" data-operator="÷" type="button">÷</button>

        <button class="key key--digit" data-digit="7" type="button">7</button>
        <button class="key key--digit" data-digit="8" type="button">8</button>
        <button class="key key--digit" data-digit="9" type="button">9</button>
        <button class="key key--operator" data-operator="×" type="button">×</button>

        <button class="key key--digit" data-digit="4" type="button">4</button>
        <button class="key key--digit" data-digit="5" type="button">5</button>
        <button class="key key--digit" data-digit="6" type="button">6</button>
        <button class="key key--operator" data-operator="−" type="button">−</button>

        <button class="key key--digit" data-digit="1" type="button">1</button>
        <button class="key key--digit" data-digit="2" type="button">2</button>
        <button class="key key--digit" data-digit="3" type="button">3</button>
        <button class="key key--operator" data-operator="+" type="button">+</button>

        <button class="key key--digit key--zero" data-digit="0" type="button">0</button>
        <button class="key key--digit" data-digit="." type="button">.</button>
        <button class="key key--equals" data-action="equals" type="button">=</button>
      </section>

    </main>
  </div>

<script src="script.js"></script>
</body>
</html>
